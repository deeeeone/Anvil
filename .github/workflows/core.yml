name: AnvilCore

on:
  push:
    branches-ignore: [main]
    paths: ["Anvil/**", "AnvilTests/**", "Package.swift", ".github/workflows/core.yml"]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Test
        run: swift test --no-parallel 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
        continue-on-error: true   # 3 WebAccount tests need the owner's Safari cookies
      - name: Summary
        run: grep -E "Executed [0-9]+ tests|Test Case .* failed" test.log | sort -u | tail -20

  linux:
    runs-on: ubuntu-latest
    container:
      image: swift:6.2
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined   # lets gdb attach for the hang watchdog
    timeout-minutes: 40
    steps:
      - run: apt-get update -qq && apt-get install -y -qq python3 git procps nodejs gdb >/dev/null
      - uses: actions/checkout@v4
      - run: |
          git config --global --add safe.directory '*'
          git config --global user.email ci@example.com
          git config --global user.name ci
      - name: Build tests
        run: swift build --build-tests
      - name: Test (with a hang watchdog that dumps stacks)
        run: STALL=90 scripts/ci-test-watchdog.sh --skip-build --no-parallel
      - name: Summary
        if: always()
        run: grep -E "Executed [0-9]+ tests|Test Case .* failed" test.log | sort -u | tail -30
      - name: Stress tests (fenced on Linux; checking whether the pipe fix cleared the hang)
        continue-on-error: true
        run: timeout 600 swift test --no-parallel -Xswiftc -DANVIL_LINUX_STRESS --filter HarnessStressTests 2>&1 | grep -E "Executed|failed|error:" | tail -40
      - name: Leftover processes
        if: always()
        run: ps -eo pid,etime,args | tail -15

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.2-release
          swift-build: 6.2-RELEASE
      - name: Build
        shell: pwsh
        run: swift build 2>&1 | Tee-Object build.log; exit $LASTEXITCODE
      - name: Errors
        if: failure()
        shell: pwsh
        run: Select-String -Path build.log -Pattern "error:" | Select-Object -First 60 | ForEach-Object { $_.Line }
      - name: Test (informational for now)
        continue-on-error: true
        shell: pwsh
        run: |
          swift test --no-parallel 2>&1 | Tee-Object wtest.log | Out-Null
          Select-String -Path wtest.log -Pattern "Executed [0-9]+ tests|Test Case .* failed|error:|Fatal|fatal" | Select-Object -Last 60 | ForEach-Object { $_.Line }
