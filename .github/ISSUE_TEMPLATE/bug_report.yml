name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project…
        2. Ask the agent to…
  - type: input
    id: model
    attributes:
      label: Model and provider
      placeholder: glm-5.3-flash-uncensored (Experiential Labs)
  - type: input
    id: version
    attributes:
      label: Anvil version or commit, and macOS version
      placeholder: 0.1.0 (abc1234), macOS 15.4
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: The failing tool step, error message or a saved model reply. Remove any keys or cookies.
      render: text
